<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Offline — SMK Al Munawwir IIBS</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F8F7F2;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #0F1A45;
    padding: 24px;
    text-align: center;
  }
  .box { max-width: 360px; }
  .emblem { width: 72px; height: 72px; margin: 0 auto 20px; }
  h1 { font-size: 1.125rem; margin: 0 0 8px; }
  p { font-size: 0.875rem; color: #6b7280; line-height: 1.6; margin: 0 0 20px; }
  button {
    background: #1B2B6B;
    color: white;
    font-weight: 600;
    padding: 0.75rem 1.75rem;
    border-radius: 9999px;
    border: none;
    font-size: 0.875rem;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="box">
    <img class="emblem" src="/images/logo-emblem.png" alt="Logo SMK Al Munawwir IIBS" />
    <h1>Tidak Ada Koneksi Internet</h1>
    <p>Halaman ini butuh koneksi internet untuk memuat data terbaru. Periksa jaringan Anda lalu coba lagi.</p>
    <button onclick="location.reload()">Coba Lagi</button>
  </div>
</body>
</html>
