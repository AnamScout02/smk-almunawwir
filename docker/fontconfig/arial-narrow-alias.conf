<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- "Arial Narrow" (font berbayar Microsoft) tidak boleh/tidak bisa diinstal di server ini.
     Alias ini bikin fontconfig otomatis mengganti permintaan "Arial Narrow" dengan
     "Liberation Sans Narrow" (font gratis, dirancang metric-compatible sebagai pengganti resmi
     Arial Narrow) — supaya file .docx tetap bisa menuliskan nama font "Arial Narrow" (benar kalau
     dibuka di Microsoft Word asli), TAPI saat dirender/dicetak di ONLYOFFICE server ini,
     bentuknya tetap tampil narrow yang benar, bukan font substitusi lain yang salah bentuk. -->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>Arial Narrow</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans Narrow</string></edit>
  </match>
</fontconfig>
