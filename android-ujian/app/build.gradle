plugins { id 'com.android.application' }

// MyAlwis Mobile (versi 2.5, 5 Oktober 2026 — passkey di WebView + kunci sidik jari saat dibuka) — seluruh portal; terkunci otomatis hanya saat mengerjakan ujian.
// Kunci penandatangan TIDAK di repo: /root/.cache/android-ujian/kunci-rilis.jks (WAJIB dicadangkan — tanpa kunci yang
// sama, versi berikutnya tidak bisa dipasang menimpa versi lama di HP siswa).
android {
    namespace 'sch.almunawwir.ujian'
    compileSdk 34
    defaultConfig {
        applicationId 'sch.almunawwir.ujian'
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName '2.5'
    }
    signingConfigs {
        rilis {
            storeFile file(System.getenv('KUNCI_JKS') ?: 'kunci-tidak-ada.jks')
            storePassword System.getenv('KUNCI_SANDI')
            keyAlias 'ujian'
            keyPassword System.getenv('KUNCI_SANDI')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.rilis
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// SATU-SATUNYA pustaka (v2.4, 5 Okt 2026): androidx.webkit untuk menyalakan WebAuthn/passkey di WebView
// (WebSettingsCompat.setWebAuthenticationSupport). Aplikasi tetap tanpa pustaka lain supaya APK kecil.
dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
}
